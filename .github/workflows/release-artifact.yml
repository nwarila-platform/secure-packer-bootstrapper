name: Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client openssl shellcheck

      - name: Verify
        run: bash scripts/verify.sh

      - name: Create Release Checksum
        run: sha256sum dist/secure-packer-bootstrapper.sh > dist/secure-packer-bootstrapper.sh.sha256

      - name: Create Release Metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${INPUT_RELEASE_TAG}"
          fi

          bundle_sha256="$(cut -d ' ' -f1 dist/secure-packer-bootstrapper.sh.sha256)"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > dist/secure-packer-bootstrapper.release.json <<EOF
          {
            "artifact": "secure-packer-bootstrapper.sh",
            "tag": "${release_tag}",
            "commit": "${GITHUB_SHA}",
            "bundle_sha256": "${bundle_sha256}",
            "workflow": "${GITHUB_WORKFLOW}",
            "workflow_ref": "${GITHUB_WORKFLOW_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "generated_at": "${generated_at}"
          }
          EOF

      - name: Attest Release Assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/secure-packer-bootstrapper.sh
            dist/secure-packer-bootstrapper.sh.sha256
            dist/secure-packer-bootstrapper.release.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            gh release create "${release_tag}" \
              dist/secure-packer-bootstrapper.sh \
              dist/secure-packer-bootstrapper.sh.sha256 \
              dist/secure-packer-bootstrapper.release.json \
              --verify-tag \
              --title "${release_tag}" \
              --generate-notes
          else
            release_tag="${INPUT_RELEASE_TAG}"
            gh release create "${release_tag}" \
              dist/secure-packer-bootstrapper.sh \
              dist/secure-packer-bootstrapper.sh.sha256 \
              dist/secure-packer-bootstrapper.release.json \
              --target "${GITHUB_SHA}" \
              --title "${release_tag}" \
              --generate-notes
          fi
